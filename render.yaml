services:
  - type: web
    name: goisure-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: goisure
      - key: JWT_SECRET
        value: goisure-secret-2026